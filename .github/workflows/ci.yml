name: CI — Playwright Responsive & SEO Audit

# ──────────────────────────────────────────────────────────────────────
# Disparo: en cualquier Pull Request hacia main/develop
#          y en push directo a main o develop
# ──────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'conductor/**'
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'conductor/**'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite pesada a ejecutar'
        required: true
        type: choice
        default: full
        options:
          - full
          - visual
          - lighthouse
  schedule:
    - cron: '0 3 * * 0'

# Sólo un job de CI activo a la vez por rama para evitar derroche de runners
concurrency:
  group: ci-playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Necesario para publicar comentarios con el resumen de Playwright en PRs (opcional)
  pull-requests: write

jobs:
  # Detecta si el cambio puede afectar al frontend público o al artefacto dist.
  # También se ejecuta en PRs de sincronización entre ramas protegidas.
  # Las modificaciones exclusivas de Edge Functions no necesitan E2E visual.
  changes:
    name: 🔎 Detect changed surfaces
    runs-on: ubuntu-latest
    outputs:
      public_frontend: ${{ steps.filter.outputs.public_frontend }}
      seo_surface: ${{ steps.filter.outputs.seo_surface }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Detect frontend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            public_frontend:
              - 'App.tsx'
              - 'index.html'
              - 'index.css'
              - 'components/**'
              - 'e2e/accessibility.public.spec.ts'
              - 'e2e/public.runtime.audit.spec.ts'
              - 'e2e/smoke.public.spec.ts'
              - 'e2e/functional.blog.spec.ts'
              - 'e2e/functional.wizard.spec.ts'
              - 'e2e/visual.public.spec.ts'
              - 'e2e/functional.mobile-public.spec.ts'
              - 'e2e/responsive.public.spec.ts'
            seo_surface:
              - 'e2e/seo.audit.spec.ts'
              # Temporary: the global SEO audit has known baseline failures.
              # Re-enable source/config triggers after the audit is repaired.

  # ────────────────────────────────────────────────────────────────────
  # JOB 1: Build estático pre-renderizado (SSG)
  # ────────────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build SSG
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Validate Route Registry
        run: npm run validate-route-registry

      - name: Validate Routes (strict)
        run: npm run validate-routes:strict

      - name: Validate Sitemap
        run: npm run validate-sitemap

      - name: Build Project (SSG + Prerender)
        run: npm run build
        env:
          # Puppeteer en CI usa Chromium del sistema, no el local de macOS
          PUPPETEER_EXECUTABLE_PATH: ''

      - name: Validate generated SEO
        run: npm run validate-static-seo

      - name: Validate internal links
        run: npm run validate-internal-links

      - name: Save dist to Cache
        uses: actions/cache/save@v4
        with:
          path: dist
          key: vitablue-dist-${{ github.sha }}

      - name: Upload dist Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: vitablue-dist-${{ github.sha }}
          path: dist
          retention-days: 1
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────
  # JOB 2: Playwright E2E — Responsive & SEO Audit
  # Depende del build (necesita el dist pre-renderizado)
  # ────────────────────────────────────────────────────────────────────
  playwright:
    name: 🎭 Playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs:
      - build
      - changes
    # Temporary: promotion PRs validate the build only while the existing
    # responsive suite is repaired.
    # Temporarily disabled while the browser suites are rebuilt from a
    # deterministic baseline. Keep the job definition for the later rollout.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'visual'))

    strategy:
      # No cancelar otros proyectos si uno falla → ver todos los resultados
      fail-fast: false
      matrix:
        include:
          - project: desktop
            tests: e2e/smoke.public.spec.ts e2e/public.runtime.audit.spec.ts e2e/functional.blog.spec.ts e2e/functional.wizard.spec.ts e2e/accessibility.public.spec.ts e2e/visual.public.spec.ts
          - project: mobile
            tests: e2e/functional.mobile-public.spec.ts
          - project: mobile-compact
            tests: e2e/responsive.public.spec.ts e2e/functional.mobile-public.spec.ts e2e/visual.public.spec.ts

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore dist from Cache
        uses: actions/cache/restore@v4
        id: restore-dist
        with:
          path: dist
          key: vitablue-dist-${{ github.sha }}

      - name: Download dist Artifact (fallback)
        if: steps.restore-dist.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vitablue-dist-${{ github.sha }}
          path: dist

      - name: Install Playwright Browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run Playwright Tests — ${{ matrix.project }}
        run: npx playwright test ${{ matrix.tests }} --project=${{ matrix.project }}
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

      - name: Upload Playwright Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report-${{ matrix.project }}-${{ github.sha }}
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright Traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: playwright-traces-${{ matrix.project }}-${{ github.sha }}
          path: test-results/
          retention-days: 7

  # ────────────────────────────────────────────────────────────────────
  # JOB 3: SEO Audit (sólo desktop, el SEO no depende del viewport)
  # Se ejecuta en paralelo con los proyectos móviles del job anterior
  # ────────────────────────────────────────────────────────────────────
  seo-audit:
    name: 🔍 SEO Audit
    runs-on: ubuntu-latest
    needs:
      - build
      - changes
    # Temporary while the global SEO audit baseline is being repaired.
    # Temporarily disabled while the static SEO suite is rebuilt.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.suite == 'full')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore dist from Cache
        uses: actions/cache/restore@v4
        id: restore-dist
        with:
          path: dist
          key: vitablue-dist-${{ github.sha }}

      - name: Download dist Artifact (fallback)
        if: steps.restore-dist.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vitablue-dist-${{ github.sha }}
          path: dist

      - name: Install Playwright Browsers (Chromium only)
        run: npx playwright install chromium --with-deps

      - name: Run SEO Audit — Desktop Only
        run: npx playwright test e2e/seo.audit.spec.ts --project=desktop
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173

      - name: Upload SEO Audit Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: seo-audit-report-${{ github.sha }}
          path: playwright-report/
          retention-days: 14

      - name: SEO Audit Summary
        if: always()
        run: |
          {
            echo "## 🔍 SEO Audit — VitaBlue v2"
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Resultado:** ${{ job.status == 'success' && '✅ Todas las páginas cumplen los requisitos SEO' || '❌ Hay páginas con problemas SEO — ver artefactos' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ────────────────────────────────────────────────────────────────────
  # JOB 4: Lighthouse — Performance, SEO, Accessibility & CWV de laboratorio
  # ────────────────────────────────────────────────────────────────────
  lighthouse:
    name: 🚦 Lighthouse Audit
    runs-on: ubuntu-latest
    needs:
      - build
      - changes
    # Temporary: promotion PRs validate the build only while the existing
    # Lighthouse job is repaired.
    # Lighthouse is reintroduced after budgets and the preview contract are
    # made reliable; it must not consume CI minutes during that work.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.suite == 'full' || inputs.suite == 'lighthouse'))

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore dist from Cache
        uses: actions/cache/restore@v4
        id: restore-dist
        with:
          path: dist
          key: vitablue-dist-${{ github.sha }}

      - name: Download dist Artifact (fallback)
        if: steps.restore-dist.outputs.cache-hit != 'true'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: vitablue-dist-${{ github.sha }}
          path: dist

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 > /tmp/vitablue-preview.log 2>&1 &

      - name: Wait for preview server
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/vitablue-preview.log
          exit 1

      - name: Run Lighthouse audit with budgets
        run: npm run audit:lh:ci

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lighthouse-report-${{ github.sha }}
          # El informe HTML contiene cientos de archivos y agota rápidamente
          # la cuota de artefactos. El JSON es suficiente para diagnosticar CI.
          path: .unlighthouse/ci-result.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload preview log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: lighthouse-preview-log-${{ github.sha }}
          path: /tmp/vitablue-preview.log
          if-no-files-found: ignore
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────
  # JOB 5: Gate de calidad — Todos los checks deben pasar
  # ────────────────────────────────────────────────────────────────────
  quality-gate:
    name: ✅ Quality Gate
    runs-on: ubuntu-latest
    needs:
      - build
      - playwright
      - seo-audit
      - lighthouse
    if: always()

    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ Build SSG falló"
            exit 1
          fi
          if [[ "${{ needs.playwright.result }}" != "success" && "${{ needs.playwright.result }}" != "skipped" ]]; then
            echo "❌ Playwright E2E falló (responsive o navegación móvil)"
            exit 1
          fi
          if [[ "${{ needs.seo-audit.result }}" != "success" && "${{ needs.seo-audit.result }}" != "skipped" ]]; then
            echo "❌ SEO Audit falló"
            exit 1
          fi
          if [[ "${{ needs.lighthouse.result }}" != "success" && "${{ needs.lighthouse.result }}" != "skipped" ]]; then
            echo "❌ Lighthouse Audit falló (budgets o Core Web Vitals)"
            exit 1
          fi
          echo "✅ Todos los checks pasaron — Quality Gate superado"

      - name: CI Summary
        if: always()
        run: |
          {
            echo "## ✅ Quality Gate — VitaBlue v2 CI"
            echo ""
            echo "| Check | Resultado |"
            echo "|-------|-----------|"
            echo "| 🏗️ Build SSG | ${{ needs.build.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| 🎭 Playwright E2E | ${{ needs.playwright.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| 🔍 SEO Audit | ${{ needs.seo-audit.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo "| 🚦 Lighthouse | ${{ needs.lighthouse.result == 'success' && '✅ Passed' || '❌ Failed' }} |"
            echo ""
            echo "> Commit: \`${{ github.sha }}\` | Branch: \`${{ github.ref_name }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
