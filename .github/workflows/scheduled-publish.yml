name: Scheduled Blog Publishing & Indexing

on:
  schedule:
    # Runs every Monday at 08:00 UTC (10:00 CEST)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    # Allows manual trigger at any time from GitHub Actions UI

permissions:
  contents: write

concurrency:
  group: vitablue-production-deploy
  cancel-in-progress: false

jobs:
  scheduled-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Sync Blog & Generate Sitemap
        run: npm run sync-blog

      - name: Validate Quality Gates
        run: |
          npm run typecheck
          npm run validate-products
          npm run validate-route-registry
          npm run validate-routes:strict
          npm run validate-sitemap

      - name: Build Project (SSG Prerender)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Validate SSG Output & SEO
        run: |
          npm run validate:ssg
          npm run validate-static-seo
          npm run validate-internal-links

      - name: Deploy Compiled Files to deploy Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: deploy
          clean: true

      - name: Notify Google Search Console
        if: success()
        run: |
          node -e "
            const https = require('https');
            const sitemapUrl = encodeURIComponent('https://www.vitablue.es/sitemap.xml');
            const pingUrl = 'https://www.google.com/ping?sitemap=' + sitemapUrl;
            console.log('Pinging Google sitemap endpoint:', pingUrl);
            https.get(pingUrl, (res) => {
              console.log('Google ping response status:', res.statusCode);
            }).on('error', (err) => {
              console.warn('Google ping warning (non-blocking):', err.message);
            });
          "
